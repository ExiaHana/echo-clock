<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Dashboard</title>
<style>
:root{
  --bg:#0b0d12; --fg:#e8ecf3; --dim:#8892a6; --accent:#6ea8ff; --card:#141824; --row:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.14); --sec:#ff8a5c;
  --onaccent:#0b0d12;   /* アクセント色の上に載せる文字（ダーク系は明るい青なので暗い文字） */
  --fs:1; --cs:1; --nw:300; --m:1.2;
  --subh:0vh;   /* 時計の下に取る高さ（天気を隠したときの日付だけ） */
  --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
:root[data-theme="amoled"]{ --bg:#000; --card:#0c0c0e; --row:rgba(255,255,255,.06); }
:root[data-theme="light"]{
  --bg:#f3f5f9; --fg:#1a2030; --dim:#5d6677; --accent:#2a6bd6; --card:#ffffff;
  --row:rgba(0,0,0,.05); --line:rgba(0,0,0,.16); --onaccent:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.night #wrap{opacity:.55}
#wrap{font-family:var(--font);width:100%;height:100%;display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:start;
  padding:calc(var(--m) * 1vh) calc(var(--m) * 0.9vw);transition:transform 2s ease,opacity 2s ease}
body.no-weather #wrap{grid-template-columns:1fr}
body.no-weather .right{display:none}

/* 左: アナログ時計 */
.clock{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;min-width:0;min-height:0}
/* --ih/--iw はページが測った窓の高さ・幅（全画面の切り替え後に Silk の 100vh が古いままのことがあるため） */
body{--side:calc(min(var(--ih, 100vh) - 2 * var(--m) * 1vh - var(--subh), var(--iw, 100vw) * .56) * var(--cs));
  --rw:calc(var(--iw, 100vw) - var(--side) - 2vw - var(--m) * 1.8vw)}   /* 右カラムの幅 */
#vhprobe{position:fixed;left:0;top:0;width:0;height:100vh;visibility:hidden;pointer-events:none}
#face{width:var(--side);height:var(--side);flex:0 0 auto}
body.no-weather{--subh:calc(8.5vh * var(--fs))}
body.no-weather.no-date{--subh:0vh}
.sub{margin-top:1.4vh;text-align:center;line-height:1.3}
.sub .date{font-size:calc(min(2.6vw,4.8vh) * var(--fs));font-weight:700}
.topline{display:flex;align-items:center;gap:1vw;flex:0 0 auto;padding:0 .6vw;min-width:0}
.rdate{font-size:calc(min(var(--rw) * .08, 8.6vh) * var(--fs));line-height:1.1;flex:0 0 auto;white-space:nowrap;font-weight:700}
#date2{display:none}
body.no-weather #date2{display:block}
body.no-date #date, body.no-date #date2, body.no-digital #dig2{display:none}

/* 文字盤の配色 */
.tk-major{stroke:var(--fg)} .tk-minor{stroke:var(--dim)}
.num{fill:var(--fg);font-family:var(--font);font-weight:var(--nw);
  stroke:var(--bg);paint-order:stroke;stroke-linejoin:round}   /* 背景色のふちで、針の上でも読めるようにする */
.dial-dig{fill:var(--dim);font-family:var(--font);font-variant-numeric:tabular-nums;
  stroke:var(--bg);paint-order:stroke;stroke-linejoin:round}   /* 文字盤の中のデジタル時刻（数字と同じく針の上） */
.hand-tip{display:none;fill:var(--bg);stroke:var(--fg);stroke-width:2.2}
body.hs-tip .hand-tip{display:inline}
.hand{stroke:var(--fg)}
.sechand{stroke:var(--sec)} .pivot{fill:var(--sec)}
body.no-nums .num{display:none}
body.no-minor .tk-minor{display:none}
body.no-second #sh{display:none}

/* 右: 天気 */
.right{display:flex;flex-direction:column;gap:1vh;min-width:0;min-height:0;height:var(--side)}
.card{background:var(--card);border-radius:2.4vh;padding:2vh 1.8vw}
#weather{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.now{display:flex;align-items:center;gap:.8vw}
#nowbox{flex:1 1 auto;min-width:0}
.now .icon{font-size:calc(min(var(--rw) * .105, 10.5vh) * var(--fs));line-height:1.2}
.now .temp{font-size:calc(min(var(--rw) * .092, 9.5vh) * var(--fs));font-weight:300;line-height:1}
.now .label{font-size:calc(min(var(--rw) * .04, 4.2vh) * var(--fs));color:var(--dim);margin-left:.2em;text-align:right;white-space:pre-line}
.hourly{display:flex;gap:.7vw;margin-top:1.2vh;flex:0 0 auto}
.hr{flex:1;min-width:0;text-align:center;background:var(--row);border-radius:1.2vh;padding:.9vh .1vw;
  display:flex;flex-direction:column;justify-content:center;
  font-size:calc(var(--hf, min(2.4vw,5vh)) * var(--fs));line-height:1.25}
.hr .h{color:var(--dim);font-size:.82em}
.hr .i{font-size:1.5em;line-height:1.15}
.hr .t{white-space:nowrap}
.hr .p{color:var(--accent);font-size:.82em}
body.no-hourly .hourly{display:none}
.days{display:flex;flex-direction:column;gap:.8vh;margin-top:1.2vh;flex:1 1 auto;min-height:0}
.day{display:flex;align-items:center;gap:1vw;background:var(--row);border-radius:1.4vh;
  flex:1 1 0;min-height:0;padding:.2vh 1.4vw;font-size:calc(min(var(--rw) * .06, 5.8vh) * var(--fs));line-height:1.2}
.day .d{flex:0 0 4.6em;color:var(--dim);white-space:nowrap}
.day .i{flex:0 0 auto;font-size:1.45em;line-height:1.1}
.day .t{flex:1;white-space:nowrap;text-align:right}
.day .t .lo{color:var(--dim)}
.day .p{flex:0 0 2.8em;text-align:right;color:var(--accent);white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:.5vh .4vw;margin-top:1.2vh;
  flex:1 1 auto;min-height:0;text-align:center;line-height:1;font-size:calc(min(var(--rw) * .05, 4.6vh) * var(--fs))}
.cal > div{display:flex;align-items:center;justify-content:center;border-radius:1vh;min-height:0}
.cal .wd{color:var(--dim);font-size:.8em}
.cal .sun{color:#ff7a7a} .cal .sat{color:var(--accent)}
.cal .today{background:var(--accent);color:var(--onaccent);font-weight:700}
.msg{color:var(--dim);font-size:calc(min(2.2vw,4vh) * var(--fs))}

/* 設定パネル（画面をタップで開閉） */
#panel{display:none;position:fixed;right:2vw;top:50%;transform:translateY(-50%);z-index:10;
  width:min(54vw,680px);max-height:96vh;overflow-y:auto;background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:2vh;padding:1.6vh 1.6vw;
  box-shadow:0 1vh 4vh rgba(0,0,0,.45);font-size:min(2vw,3.7vh);-webkit-user-select:none}
#panel.open{display:block}
#banner{display:none;position:fixed;left:50%;bottom:2.4vh;transform:translateX(-50%);z-index:20;width:min(92vw,900px);
  background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:2vh;padding:1.6vh 1.6vw;
  box-shadow:0 1vh 4vh rgba(0,0,0,.5);font-size:min(2.2vw,4vh);-webkit-user-select:none}
#banner.open{display:block}
#banner .bmsg{margin-bottom:1vh;line-height:1.35}
#banner .bt{display:flex;gap:.8vw}
#banner button{flex:1;min-height:min(8vh,48px);border:1px solid var(--line);background:var(--row);color:var(--fg);
  border-radius:1.2vh;font:inherit;font-size:.9em;padding:0 .6vw}
#banner button.main{background:var(--accent);border-color:var(--accent);color:#fff;flex:2}
.stat{display:flex;justify-content:space-between;gap:1vw;font-size:.82em;padding:.3vh 0}
.stat b{font-weight:500;text-align:right}
.stat b.warn{color:#ffb86e}
#st-note{color:var(--dim);font-size:.74em;min-height:1.2em}
.tabs{margin-bottom:.6vh}
.tabpage{display:none}
.tabpage.on{display:block}
#panel h2{font-size:1em;font-weight:500;margin-bottom:1.2vh;display:flex;justify-content:space-between;align-items:center}
#panel .hint{color:var(--dim);font-size:.72em;font-weight:400}
.row{margin:1vh 0}
.row > .lb{color:var(--dim);font-size:.78em;margin-bottom:.5vh;display:flex;justify-content:space-between}
input[type=range]{width:100%;height:min(4.8vh,30px);accent-color:var(--accent)}
.seg{display:flex;gap:.6vw}
.seg button,.tg,.act{flex:1;min-height:min(6.6vh,42px);border:1px solid var(--line);background:var(--row);color:var(--fg);
  border-radius:1.2vh;font:inherit;font-size:.86em;padding:0 .6vw}
.seg button.on,.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg .sw{flex:0 0 auto;width:min(6.6vh,42px);height:min(6.6vh,42px);min-height:0;border-radius:50%;border:3px solid transparent;padding:0}
.seg .sw.on{border-color:var(--fg)}
.tgs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8vh .6vw}
.tgs .tg{font-size:.78em}
.acts{display:flex;gap:.8vw;margin-top:1.2vh}
.act.close{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="wrap">
  <section class="clock">
    <svg id="face" viewBox="7 7 186 186" aria-label="clock">
      <g id="ticks"></g>
      <g id="hh"><line id="hhl" class="hand" x1="100" y1="100" x2="100" y2="52" stroke-width="5" stroke-linecap="round"/>
        <circle class="hand-tip" cx="100" cy="52" r="6.5"/></g>
      <g id="mh"><line id="mhl" class="hand" x1="100" y1="100" x2="100" y2="26" stroke-width="3" stroke-linecap="round"/>
        <circle class="hand-tip" cx="100" cy="26" r="5.5"/></g>
      <g id="sh"><line class="sechand" x1="100" y1="112" x2="100" y2="22" stroke-width="1.5" stroke-linecap="round"/></g>
      <g id="nums"></g><!-- 数字は針より上に描く（重なっても読めるように） -->
      <text id="dig2" class="dial-dig" x="100" y="135" text-anchor="middle" dominant-baseline="central"></text>
      <circle class="pivot" cx="100" cy="100" r="4"/>
    </svg>
    <div class="sub">
      <div class="date" id="date2"></div>
    </div>
  </section>
  <section class="right">
    <div class="topline"><div class="rdate" id="date"></div><div class="now" id="nowbox"></div></div>
    <div class="card" id="weather"><div class="msg">天気を取得中…</div></div>
  </section>
</div>

<div id="panel" role="dialog" aria-label="設定">
  <h2><span>表示設定</span><span class="hint">変更は自動で保存されます</span></h2>
  <div class="seg tabs">
    <button data-tab="size" class="on">サイズ</button><button data-tab="design">デザイン</button><button data-tab="show">表示</button>
  </div>

  <div class="tabpage on" data-page="size">
    <div class="row"><div class="lb"><span>日付・天気の文字サイズ</span><span id="v-fs"></span></div>
      <input type="range" data-key="fs" min="0.7" max="1.5" step="0.05"></div>
    <div class="row"><div class="lb"><span>時計の大きさ</span><span id="v-cs"></span></div>
      <input type="range" data-key="cs" min="0.5" max="1" step="0.05"></div>
    <div class="row"><div class="lb"><span>1時間ごと天気の表示数</span><span id="v-hc"></span></div>
      <input type="range" data-key="hc" min="3" max="6" step="1"></div>
    <div class="row"><div class="lb"><span>画面の余白</span><span id="v-mg"></span></div>
      <input type="range" data-key="mg" min="0" max="5" step="0.2"></div>
    <div class="row"><div class="lb"><span>数字のサイズ</span><span id="v-ns"></span></div>
      <input type="range" data-key="ns" min="10" max="28" step="1"></div>
    <div class="row"><div class="lb"><span>数字の太さ</span><span id="v-nw"></span></div>
      <input type="range" data-key="nw" min="100" max="900" step="100"></div>
  </div>

  <div class="tabpage" data-page="design">
    <div class="row"><div class="lb">針のデザイン</div>
      <div class="seg" data-choice="hands">
        <button data-val="thin">細</button><button data-val="std">標準</button><button data-val="bold">太</button><button data-val="tip">先端丸</button>
      </div></div>
    <div class="row"><div class="lb">フォント</div>
      <div class="seg" data-choice="font">
        <button data-val="gothic">ゴシック</button><button data-val="mincho">明朝</button><button data-val="maru">丸ゴ</button><button data-val="mono">等幅</button><button data-val="serif">欧文</button>
      </div></div>
    <div class="row"><div class="lb">テーマ</div>
      <div class="seg" data-choice="theme">
        <button data-val="dark">ダーク</button><button data-val="amoled">真っ黒</button><button data-val="light">ライト</button>
      </div></div>
    <div class="row"><div class="lb">秒針・アクセントの色</div>
      <div class="seg" data-choice="sec" style="gap:1.4vw">
        <button class="sw" data-val="#ff8a5c" style="background:#ff8a5c" aria-label="オレンジ"></button>
        <button class="sw" data-val="#6ea8ff" style="background:#6ea8ff" aria-label="ブルー"></button>
        <button class="sw" data-val="#5fd38d" style="background:#5fd38d" aria-label="グリーン"></button>
        <button class="sw" data-val="#ff6fa5" style="background:#ff6fa5" aria-label="ピンク"></button>
        <button class="sw" data-val="#f2c94c" style="background:#f2c94c" aria-label="イエロー"></button>
        <button class="sw" data-val="#9aa4b5" style="background:#9aa4b5" aria-label="グレー"></button>
      </div></div>
  </div>

  <div class="tabpage" data-page="show">
    <div class="row"><div class="lb">表示の切り替え</div>
      <div class="tgs">
        <button class="tg" data-toggle="nums">数字</button>
        <button class="tg" data-toggle="minor">細かい目盛り</button>
        <button class="tg" data-toggle="second">秒針</button>
        <button class="tg" data-toggle="digital">デジタル時刻</button>
        <button class="tg" data-toggle="date">日付</button>
        <button class="tg" data-toggle="weather">天気</button>
        <button class="tg" data-toggle="hourly">1時間ごと天気</button>
        <button class="tg" data-toggle="night">夜間の減光</button>
      </div></div>
    <div class="row"><div class="lb">天気の下の欄</div>
      <div class="seg" data-choice="lower">
        <button data-val="days">日ごとの天気</button><button data-val="cal">カレンダー</button>
      </div></div>
    <div class="row"><div class="lb">状態</div>
      <div class="stat"><span>全画面</span><b id="st-fs"></b></div>
      <div class="stat"><span>常時表示（無音再生）</span><b id="st-au"></b></div>
      <div class="stat"><span>画面の大きさ（調査用）</span><b id="st-sz"></b></div>
      <div id="st-note"></div>
      <div class="tgs" style="grid-template-columns:1fr 1fr;margin-top:.6vh">
        <button class="tg" id="au-btn">無音再生を開始／再開</button>
        <button class="tg" id="reload">ページを再読み込み</button>
      </div></div>
  </div>

  <div class="acts">
    <button class="act" id="fs">全画面</button>
    <button class="act" id="reset">初期設定に戻す</button>
    <button class="act close" id="close">閉じる</button>
  </div>
</div>

<div id="vhprobe"></div>
<div id="banner" role="alert">
  <div class="bmsg" id="b-msg"></div>
  <div class="bt">
    <button class="main" id="b-go">タップして復帰</button>
    <button id="b-nofs">全画面を使わない</button>
    <button id="b-later">あとで</button>
  </div>
</div>

<script>
/* ================= 設定 ================= */
const CONFIG = {
  PLACE: "東京", LAT: 35.6895, LON: 139.6917,
  WEATHER_REFRESH_MIN: 30,
  NIGHT_FROM: 23, NIGHT_TO: 6,   // この時間帯は減光
  PANEL_AUTOCLOSE_SEC: 30
};
const DEFAULTS = {
  ver: 2, fs: 1, cs: 1, mg: 1.2, hc: 6, ns: 17, nw: 300, font: "gothic", hands: "std",
  theme: "dark", sec: "#ff8a5c", lower: "days",   // lower=天気の下の欄（days=日ごとの天気 / cal=カレンダー）
  nums: true, minor: true, second: true, digital: true, date: true, weather: true, hourly: true, night: true,
  fsWanted: false   // 全画面を使う意思（設定ボタンで入れた/解除した状態。初期化では変えない）
};
const FONTS = {   // 端末内蔵フォントのみ（無い環境では次の候補に自動で切り替わります）
  gothic: '"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif',
  mincho: '"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Times New Roman",serif',
  maru:   '"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif',
  mono:   'ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace',
  serif:  'Georgia,"Times New Roman",Times,serif'
};
const HANDS = {   // hw=時針の太さ mw=分針の太さ tip=先端に丸
  thin: { hw: 3,   mw: 1.8, tip: false },
  std:  { hw: 5,   mw: 3,   tip: false },
  bold: { hw: 8,   mw: 5,   tip: false },
  tip:  { hw: 3.5, mw: 2.2, tip: true }
};
const SLIDERS = {   // 設定キー: 表示フォーマット
  fs: v => Math.round(v * 100) + "%",
  cs: v => Math.round(v * 100) + "%",
  mg: v => v.toFixed(1),
  hc: v => v + "時間",
  ns: v => String(v),
  nw: v => String(v)
};
const STORE_KEY = "echoDash.v1";
/* ======================================== */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const WD = ["日","月","火","水","木","金","土"];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ---------- 設定の保存・適用 ---------- */
let S = Object.assign({}, DEFAULTS);
let storedVer = 0;
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { const o = JSON.parse(raw); storedVer = o.ver || 0; S = Object.assign(S, o); }
} catch (_) {}
if (storedVer < 2) { S.hc = DEFAULTS.hc; S.ver = DEFAULTS.ver; }   // 旧設定の移行（表示数を6に）
function sanitize() {
  S.fsWanted = !!S.fsWanted;
  if (!FONTS[S.font]) S.font = DEFAULTS.font;
  if (!HANDS[S.hands]) S.hands = DEFAULTS.hands;
  if (["days", "cal"].indexOf(S.lower) < 0) S.lower = DEFAULTS.lower;
  Object.keys(SLIDERS).forEach(k => { if (typeof S[k] !== "number" || isNaN(S[k])) S[k] = DEFAULTS[k]; });
}
sanitize();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (_) {} }

function applySettings() {
  sanitize();
  const root = document.documentElement;
  root.style.setProperty("--fs", S.fs);
  root.style.setProperty("--cs", S.cs);
  root.style.setProperty("--m", S.mg);
  root.style.setProperty("--sec", S.sec);
  root.style.setProperty("--nw", S.nw);
  root.style.setProperty("--font", FONTS[S.font]);
  root.setAttribute("data-theme", S.theme);
  const b = document.body.classList;
  b.toggle("no-nums", !S.nums);
  b.toggle("no-minor", !S.minor);
  b.toggle("no-second", !S.second);
  b.toggle("no-digital", !S.digital);
  b.toggle("no-date", !S.date);
  b.toggle("no-weather", !S.weather);
  b.toggle("no-hourly", !S.hourly);
  const hd = HANDS[S.hands];
  b.toggle("hs-tip", hd.tip);
  $("hhl").setAttribute("stroke-width", hd.hw);
  $("mhl").setAttribute("stroke-width", hd.mw);
  drawFace();
  fitHourly();
  if (lastW && $("weather").querySelector(".hr") && $("weather").querySelectorAll(".hr").length !== Math.min(S.hc, 6)) renderWeather(lastW);
  else renderLower();
  // パネル表示の同期
  Object.keys(SLIDERS).forEach(k => {
    const inp = document.querySelector('input[data-key="' + k + '"]');
    if (inp) inp.value = S[k];
    $("v-" + k).textContent = SLIDERS[k](S[k]);
  });
  document.querySelectorAll("[data-choice]").forEach(g =>
    g.querySelectorAll("button").forEach(btn => btn.classList.toggle("on", btn.dataset.val === String(S[g.dataset.choice]))));
  document.querySelectorAll("[data-toggle]").forEach(btn =>
    btn.setAttribute("aria-pressed", S[btn.dataset.toggle] ? "true" : "false"));
  applyNight();
}

/* ---------- 文字盤（目盛り・数字） ---------- */
// 角度 theta(0=真上, 時計回り)の方向で、文字盤の縁から inset だけ内側にある座標と、中心から外向きの単位ベクトル(dx,dy)を返す
function boundary(theta, inset) {
  const dx = Math.sin(theta), dy = -Math.cos(theta), R = 92 - inset;
  return { x: 100 + R * dx, y: 100 + R * dy, dx: dx, dy: dy };
}
function drawFace() {
  const NS = "http://www.w3.org/2000/svg", g = $("ticks"), gn = $("nums");
  g.textContent = ""; gn.textContent = "";
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0, len = major ? 10 : 5;
    const p = boundary(i * 6 * Math.PI / 180, 0);
    const ox = p.x, oy = p.y;                                  // 目盛りは中心に向かって放射状
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", major ? "tk-major" : "tk-minor");
    ln.setAttribute("x1", ox.toFixed(2)); ln.setAttribute("y1", oy.toFixed(2));
    ln.setAttribute("x2", (ox - p.dx * len).toFixed(2)); ln.setAttribute("y2", (oy - p.dy * len).toFixed(2));
    ln.setAttribute("stroke-width", major ? 2.4 : 0.9);
    ln.setAttribute("stroke-linecap", "round");
    g.appendChild(ln);
  }
  const inset = 10 + 6 + S.ns * 0.6;                         // 数字は目盛りの内側の円の上に並べる
  for (let n = 1; n <= 12; n++) {
    const p = boundary(n * 30 * Math.PI / 180, inset);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "num");
    t.setAttribute("x", p.x.toFixed(2));
    t.setAttribute("y", p.y.toFixed(2));
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-size", S.ns);
    t.setAttribute("stroke-width", (S.ns * 0.22).toFixed(1));   // ふちの太さは数字の大きさに合わせる
    t.textContent = n;
    gn.appendChild(t);
  }
  // デジタル時刻は中心と「6」のあいだ。大きさは数字に合わせる
  const dg = $("dig2"), fsz = S.ns * 0.85;
  dg.setAttribute("y", (100 + (92 - inset) * 0.55).toFixed(2));
  dg.setAttribute("font-size", fsz.toFixed(1));
  dg.setAttribute("stroke-width", (fsz * 0.22).toFixed(1));
}

/* ---------- 時計 ---------- */
let lastMin = -1;
function applyNight() {
  const hr = new Date().getHours();
  document.body.classList.toggle("night", S.night && (hr >= CONFIG.NIGHT_FROM || hr < CONFIG.NIGHT_TO));
}
function tick() {
  const d = new Date();
  const s = d.getSeconds() + d.getMilliseconds() / 1000;
  const m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
  $("hh").setAttribute("transform", `rotate(${h * 30} 100 100)`);
  $("mh").setAttribute("transform", `rotate(${m * 6} 100 100)`);
  $("sh").setAttribute("transform", `rotate(${s * 6} 100 100)`);

  if (d.getMinutes() !== lastMin) {
    lastMin = d.getMinutes();
    const ds = `${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`;
    $("date").textContent = ds; $("date2").textContent = ds;
    $("dig2").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    // 焼き付き防止：毎分わずかに位置をずらす
    const dx = Math.round(Math.random() * 12 - 6), dy = Math.round(Math.random() * 12 - 6);
    $("wrap").style.transform = `translate(${dx}px, ${dy}px)`;
    applyNight();
    if (S.lower === "cal" && d.getDate() !== calDay) renderLower();
  }
  requestAnimationFrame(tick);
}

/* ---------- 天気 (Open-Meteo) ---------- */
const WMO = (c) => {
  if (c === 0) return ["☀️", "快晴"];
  if (c === 1) return ["🌤️", "晴れ"];
  if (c === 2) return ["⛅", "薄曇り"];
  if (c === 3) return ["☁️", "曇り"];
  if (c === 45 || c === 48) return ["🌫️", "霧"];
  if (c >= 51 && c <= 57) return ["🌦️", "霧雨"];
  if (c >= 61 && c <= 67) return ["🌧️", "雨"];
  if (c >= 71 && c <= 77) return ["❄️", "雪"];
  if (c >= 80 && c <= 82) return ["🌦️", "にわか雨"];
  if (c === 85 || c === 86) return ["🌨️", "にわか雪"];
  if (c >= 95) return ["⛈️", "雷雨"];
  return ["❓", "不明"];
};

let lastW = null;
function renderWeather(j) {

// 天気の下の欄：設定に応じて日ごとの天気かカレンダーを置く（カレンダーは天気が取れなくても出す）

// 日本の祝日。キーは "月-日"。ネットで取れた年はその一覧を使い、無い年は calcHolidays で計算する。
// 取得先は内閣府の一覧を元にした有志の公開データ（去年〜来年の分）。取れた一覧は 1 日だけ端末に覚えておく。
const HOL_URL = "https://holidays-jp.github.io/api/v1/date.json";
const HOL_KEY = "echoDash.holidays";   // 設定（echoDash.v1）とは別に保存する
let netHol = {};                       // 年 → { "月-日": 名前 }
function setNetHol(days) {
  const by = {};
  Object.keys(days).forEach(s => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m || typeof days[s] !== "string") return;
    (by[+m[1]] = by[+m[1]] || {})[(+m[2]) + "-" + (+m[3])] = days[s];
  });
  netHol = by;
  return Object.keys(by).length > 0;
}
try { const o = JSON.parse(localStorage.getItem(HOL_KEY) || "null"); if (o && o.days) setNetHol(o.days); } catch (_) {}
async function loadHolidays() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem(HOL_KEY) || "null"); } catch (_) {}
  if (o && o.fetched && nowMs() - o.fetched < 24 * 3600 * 1000) return;
  try {
    const res = await fetch(HOL_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const days = await res.json();
    if (!days || typeof days !== "object" || !setNetHol(days)) throw new Error("中身が空");
    try { localStorage.setItem(HOL_KEY, JSON.stringify({ fetched: nowMs(), days: days })); } catch (_) {}
    if (S.lower === "cal") renderLower();
  } catch (e) {
    console.error("holidays", e);   // 取れなければ、覚えている一覧か計算のまま
  }
}
function jpHolidays(y) { return netHol[y] || calcHolidays(y); }

// 祝日を、いまの祝日法の決まりで計算する（ネットで取れなかった年の代わり）。
// 春分・秋分は 1980〜2099 年に使える近似式。一度きりの祝日は含まれない。
const holCache = {};
function calcHolidays(y) {
  if (holCache[y]) return holCache[y];
  const H = {}, key = dt => (dt.getMonth() + 1) + "-" + dt.getDate();
  const set = (m, d, name) => { H[m + "-" + d] = name; };
  const nthMon = (m, n) => 1 + (8 - new Date(y, m - 1, 1).getDay()) % 7 + (n - 1) * 7;   // m月の第n月曜
  const k = y - 1980, q = Math.floor(k / 4);
  set(1, 1, "元日"); set(1, nthMon(1, 2), "成人の日"); set(2, 11, "建国記念の日"); set(2, 23, "天皇誕生日");
  set(3, Math.floor(20.8431 + 0.242194 * k) - q, "春分の日");
  set(4, 29, "昭和の日"); set(5, 3, "憲法記念日"); set(5, 4, "みどりの日"); set(5, 5, "こどもの日");
  set(7, nthMon(7, 3), "海の日"); set(8, 11, "山の日"); set(9, nthMon(9, 3), "敬老の日");
  set(9, Math.floor(23.2488 + 0.242194 * k) - q, "秋分の日");
  set(10, nthMon(10, 2), "スポーツの日"); set(11, 3, "文化の日"); set(11, 23, "勤労感謝の日");
  const base = Object.assign({}, H);
  for (let dt = new Date(y, 0, 2); dt.getFullYear() === y; dt.setDate(dt.getDate() + 1)) {   // 国民の休日（祝日に挟まれた平日）
    const prev = new Date(y, dt.getMonth(), dt.getDate() - 1), next = new Date(y, dt.getMonth(), dt.getDate() + 1);
    if (!base[key(dt)] && base[key(prev)] && base[key(next)] && next.getFullYear() === y) H[key(dt)] = "国民の休日";
  }
  Object.keys(base).forEach(s => {                                   // 振替休日（日曜の祝日の後の、最初の祝日でない日）
    const p = s.split("-"), dt = new Date(y, +p[0] - 1, +p[1]);
    if (dt.getDay() !== 0) return;
    do dt.setDate(dt.getDate() + 1); while (H[key(dt)]);
    if (dt.getFullYear() === y) H[key(dt)] = "振替休日";
  });
  return (holCache[y] = H);
}

let calDay = -1;   // カレンダーを描いた日（日付が変わったら描き直す）
function renderCal() {
  const d = new Date(), y = d.getFullYear(), mo = d.getMonth(), today = d.getDate();
  const off = new Date(y, mo, 1).getDay(), dim = new Date(y, mo + 1, 0).getDate();
  const hol = jpHolidays(y);
  const cal = el("div", "cal");
  WD.forEach((w, i) => cal.append(el("div", "wd" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), w)));
  for (let i = 0; i < off; i++) cal.append(el("div"));
  for (let n = 1; n <= dim; n++) {
    const wd = (off + n - 1) % 7, h = hol[(mo + 1) + "-" + n];
    const c = el("div", n === today ? "today" : (wd === 0 || h) ? "sun" : wd === 6 ? "sat" : "", n);
    if (h) c.title = h;
    cal.append(c);
  }
  calDay = today;
  return cal;
}

function buildDays(j) {
  const days = el("div", "days");
  [1, 2, 3, 4].forEach(i => {   // 明日から4日分。ラベルは「10/22(木)」形式
    const dp = String(j.daily.time[i]).split("-");
    const dd = new Date(+dp[0], +dp[1] - 1, +dp[2]);
    const name = (+dp[1]) + "/" + (+dp[2]) + "(" + WD[dd.getDay()] + ")";
    const [ic] = WMO(j.daily.weather_code[i]);
    const row = el("div", "day");
    const t = el("div", "t");
    t.append(document.createTextNode(Math.round(j.daily.temperature_2m_max[i]) + "° "),
      el("span", "lo", Math.round(j.daily.temperature_2m_min[i]) + "°"));
    const p = j.daily.precipitation_probability_max[i];
    row.append(el("div", "d", name), el("div", "i", ic), t, el("div", "p", (p == null ? "-" : p) + "%"));
    days.append(row);
  });
  return days;
}

// 時間ごとの天気：セルの幅に収まる最大の文字サイズ（縦は内容に合わせてコンパクト）
function fitHourly() {
  const h = document.querySelector("#weather .hourly");
  if (!h || !h.children.length || !h.clientWidth) return;
  const hs = getComputedStyle(h);
  const gap = parseFloat(hs.columnGap) || 0;
  const n = h.children.length;
  const cellW = (h.clientWidth - gap * (n - 1)) / n;
  const px = Math.max(10, Math.min(cellW / 2.5, innerHeight * 0.055)) / (S.fs || 1);
  h.style.setProperty("--hf", px.toFixed(1) + "px");
}

// 窓の大きさを測り直して、時計と右の欄の大きさに使う。測った値は状態の欄にも出す（崩れたときの調査用）。
// 全画面の切り替え直後は値が落ち着かないことがあるので、少しずつ間をあけて何度か測る。
function measure() {
  const w = innerWidth, h = innerHeight, root = document.documentElement;
  root.style.setProperty("--iw", w + "px");
  root.style.setProperty("--ih", h + "px");
  root.style.height = h + "px"; document.body.style.height = h + "px";

  const vv = window.visualViewport;

    " / 画面 " + screen.width + "×" + screen.height;
}
let measureTimers = [];
function measureSoon() {
  measureTimers.forEach(clearTimeout);
  measure();
  measureTimers = [300, 1000, 2500].map(ms => setTimeout(measure, ms));
}
window.addEventListener("resize", measureSoon);
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, measureSoon));
document.addEventListener("visibilitychange", () => { if (!document.hidden) measureSoon(); });
setInterval(measure, 10000);   // 合図が来ない場合の念のため

/* ================= 全画面と常時表示（無音再生）の維持 =================
   Amazon 非公式の回避策です。Echo Show 5 第1世代の Silk で効くことは保証できません。
   ・全画面：Fullscreen API を使う。要求はユーザー操作が必要なため、自動復帰を拒否されたら「タップで復帰」を出す。
   ・常時表示：無音の音声をループ再生して「使用中」に見せる（外部スクリプトなし、無音データはここで生成）。
   全画面の復帰と無音再生の再開は、互いに独立して成功・失敗を扱う。 */
const IS_SILK = /silk/i.test(navigator.userAgent);
const nowMs = () => Date.now();

/* ---------- 全画面 ---------- */
const fsRoot = document.documentElement;
const fsReq = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
const fsExitFn = document.exitFullscreen || document.webkitExitFullscreen;
const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const fsState = { supported: !!fsReq, busy: false, lastAuto: 0, err: "" };

// 全画面を要求する。ユーザー操作のイベント内から呼ぶと、要求は同期的に（await より前に）行われる。
// 成否は Promise の結果ではなく、実際の状態（fullscreenElement）で判定する。重複呼び出しは busy で無視する。
function fsRequest(auto) {
  if (!fsState.supported) { fsState.err = "非対応"; return Promise.resolve(false); }
  if (fsActive()) return Promise.resolve(true);
  if (fsState.busy) return Promise.resolve(false);
  if (auto && nowMs() - fsState.lastAuto < 1000) return Promise.resolve(false);   // 自動の連打を防ぐ
  fsState.busy = true; if (auto) fsState.lastAuto = nowMs();
  let p;
  try { p = fsReq.call(fsRoot); }
  catch (e) { fsState.busy = false; fsState.err = (e && e.name) || "例外"; refreshStatus(); return Promise.resolve(false); }
  // 要求の Promise が決着しない場合に busy が残り続けないよう、3秒で打ち切る
  const timeout = new Promise(r => setTimeout(() => r("timeout"), 3000));
  return Promise.race([Promise.resolve(p).then(() => "ok"), timeout])
    .then(v => { if (v === "timeout") fsState.err = "応答なし"; },
          e => { fsState.err = (e && e.name) || "拒否"; })
    .then(() => new Promise(r => setTimeout(r, 400)))          // fullscreenchange の反映を待つ
    .then(() => {
      fsState.busy = false;
      const ok = fsActive();
      fsState.err = ok ? "" : (fsState.err || "反映されず");
      refreshStatus();
      return ok;
    });
}
const fsNeeded = () => S.fsWanted && fsState.supported && !fsActive() && !fsState.busy && !document.hidden;

// 設定ボタン：入っていれば解除（意図的な解除＝自動復帰を止める）、入っていなければ全画面にする
function onFsButton() {
  if (fsState.busy) return;   // 処理中の連打は無視する（失敗扱いにすると自動復帰の意思まで消えるため）
  if (fsActive()) {
    S.fsWanted = false; save();
    try { fsExitFn.call(document); } catch (_) {}
    refreshStatus();
    return;
  }
  S.fsWanted = true; save();
  fsRequest(false).then(ok => {
    if (!ok) { S.fsWanted = false; save(); showNote("全画面にできませんでした（" + fsState.err + "）"); }
    refreshStatus();
  });
}
function fsGiveUp() { S.fsWanted = false; save(); refreshStatus(); }       // 「全画面を使わない」

/* ---------- 無音再生 ---------- */
const au = { el: null, url: "", started: false, status: IS_SILK ? "idle" : "off", err: "",
             busy: false, lastTry: 0, lastT: -1, stalls: 0, rebuilds: 0 };
let auFirstOff = null;        // 初回タップの見張りを外す処理（再生中になったら auEval から呼ぶ）
function silentWavUrl(sec, rate) {
  const n = sec * rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, "data"); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).fill(128);                       // 8bit PCM の無音は 128
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function auEval() {           // 実際の再生状態から「開始待ち／再生中／再開が必要」を決める
  const a = au.el;
  let st;
  if (!IS_SILK) st = "off";
  else if (!a) st = au.started ? "needs" : "idle";
  else if (a.error) st = "needs";
  else if (!au.started) st = "idle";
  else if (a.paused || a.ended || a.muted || au.stalls >= 2) st = "needs";
  else st = "playing";
  if (st === "playing") {
    au.rebuilds = 0; au.err = "";
    if (auFirstOff) { auFirstOff(); auFirstOff = null; }   // 作り直した音声でも、初回タップの見張りを外す
  }
  if (st !== au.status) { au.status = st; }
  refreshStatus();
}
function auCreate() {
  if (au.el) { try { au.el.pause(); } catch (_) {} try { au.el.remove(); } catch (_) {} }
  const a = document.createElement("audio");
  if (!au.url) au.url = silentWavUrl(2, 8000);
  // loop にする：末尾まで行くと一度 pause が出て「再開が必要」の案内が2秒ごとに一瞬出ていたため
  a.src = au.url; a.muted = !au.started; a.autoplay = true; a.loop = true;
  a.setAttribute("playsinline", "");
  a.addEventListener("playing", auEval);
  a.addEventListener("volumechange", auEval);
  a.addEventListener("pause", () => { auEval(); if (!a.ended) autoRecoverAudio(); });
  a.addEventListener("ended", () => { try { a.currentTime = 0; } catch (_) {} auPlay(); });
  a.addEventListener("error", () => {
    auEval();
    if (au.rebuilds++ < 3) setTimeout(() => { auCreate(); auPlay(); }, 500);   // 作り直しは3回まで
  });
  document.body.appendChild(a);
  au.el = a;
}
// 再生を試みる。失敗は握りつぶさず、理由を au.err に残して状態に反映する。
function auPlay() {
  if (!au.el) auCreate();
  au.lastTry = nowMs();
  let p;
  try { p = au.el.play(); }
  catch (e) { au.err = (e && e.name) || "例外"; auEval(); return Promise.resolve(false); }
  return Promise.resolve(p).then(
    () => { au.err = ""; auEval(); return true; },
    e => { au.err = (e && e.name) || "拒否"; auEval(); return false; });
}
// ユーザー操作から呼ぶ（開始・再開）。ミュートを外して再生する。
function auResume() {
  if (!IS_SILK) { showNote("Silk 以外では無音再生は不要です"); return Promise.resolve(false); }
  au.started = true;
  if (!au.el || au.el.error) auCreate();
  au.el.muted = false;
  return auPlay();
}
// 自動での再開（操作なし）。拒否されたら「再開が必要」の表示のまま。
function autoRecoverAudio(force) {
  if (!IS_SILK || !au.started || au.busy) return;
  if (!force && nowMs() - au.lastTry < 3000) return;       // pause/見張り由来の連打を防ぐ（復帰イベント由来は force）
  au.busy = true;
  Promise.resolve().then(() => { if (!au.el || au.el.error) auCreate(); au.el.muted = false; return auPlay(); })
    .catch(() => {}).then(() => { au.busy = false; });
}
function wake() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (_) {} }

/* ---------- 状態表示・復帰案内 ---------- */
let noteTimer = null;
function showNote(msg, ms) {
  const n = $("st-note"); if (!n) return;
  n.textContent = msg; clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { n.textContent = ""; }, ms || 6000);
}
let snoozed = false;
function refreshStatus() {
  // 全画面
  const fsTxt = !fsState.supported ? "非対応" : fsActive() ? "全画面中" : S.fsWanted ? "復帰が必要" : "通常表示";
  $("st-fs").textContent = fsTxt;
  $("st-fs").className = (S.fsWanted && !fsActive() && fsState.supported) ? "warn" : "";
  $("fs").textContent = fsActive() ? "全画面を解除" : "全画面にする";
  // 無音再生
  const auTxt = { off: "Silk 以外では不要", idle: "開始待ち（1回タップ）", playing: "再生中", needs: "再開が必要" }[au.status];
  $("st-au").textContent = auTxt + (au.status === "needs" && au.err ? "（" + au.err + "）" : "");
  $("st-au").className = au.status === "needs" ? "warn" : "";
  // 復帰案内
  const needFs = fsNeeded(), needAu = IS_SILK && au.started && au.status === "needs";
  const b = $("banner");
  if ((needFs || needAu) && !snoozed) {
    const msgs = [];
    if (needFs) msgs.push("全画面が解除されました。");
    if (needAu) msgs.push("常時表示用の無音再生が止まりました。");
    $("b-msg").textContent = msgs.join(" ") + "画面のどこかをタップすると復帰します。";
    $("b-nofs").style.display = needFs ? "" : "none";
    b.classList.add("open");
  } else b.classList.remove("open");
}
// タップでの復帰：全画面と無音再生を、同じタップの中で互いに独立して要求する（片方の失敗で他方を止めない）
// 復帰が必要なものが無ければ何もせず false を返す
function recoverByTap() {
  const needFs = fsNeeded(), needAu = IS_SILK && au.started && au.status === "needs";
  if (!needFs && !needAu) return false;
  if (needFs) { try { fsRequest(false); } catch (_) {} }
  if (needAu) { try { auResume(); } catch (_) {} }
  wake();
  return true;
}
$("b-go").addEventListener("click", recoverByTap);
$("b-nofs").addEventListener("click", fsGiveUp);
$("b-later").addEventListener("click", () => { snoozed = true; refreshStatus(); setTimeout(() => { snoozed = false; refreshStatus(); }, 60000); });

/* ---------- 復帰の検知（イベントが重複しても1回にまとめる） ---------- */
let retTimer = null;
function onReturn() { snoozed = false; clearTimeout(retTimer); retTimer = setTimeout(handleReturn, 350); }
function handleReturn() {
  if (document.hidden) return;
  try { autoRecoverAudio(true); } catch (_) {}              // 音声と全画面は互いに独立
  try {
    if (S.fsWanted && fsState.supported && !fsActive()) fsRequest(true).then(refreshStatus);
    else refreshStatus();
  } catch (_) { refreshStatus(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { onReturn(); wake(); } });
window.addEventListener("focus", onReturn);
window.addEventListener("pageshow", onReturn);
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, refreshStatus));

/* ---------- 起動時の準備（Silk のみ） ---------- */
if (IS_SILK) {
  auCreate();
  const evs = ["pointerdown", "click", "keydown"];
  const onFirst = () => { au.started = true; au.el.muted = false; auPlay(); wake(); };
  auFirstOff = () => evs.forEach(e => document.removeEventListener(e, onFirst));
  evs.forEach(e => document.addEventListener(e, onFirst));
  auPlay();
  setInterval(() => {                                       // 見張り：音が止まった／進んでいない場合を検出
    if (!au.el || !au.started) return;
    const t = au.el.currentTime;
    au.stalls = (!au.el.paused && !au.el.ended && t === au.lastT) ? au.stalls + 1 : 0;
    au.lastT = t;
    auEval();
    if (au.status !== "playing") autoRecoverAudio();
  }, 4000);
}

/* ---------- 起動 ---------- */
applySettings();
measure();
requestAnimationFrame(tick);
loadWeather();
setInterval(loadWeather, CONFIG.WEATHER_REFRESH_MIN * 60000);
loadHolidays();
setInterval(loadHolidays, 3600 * 1000);   // 1時間ごとに見て、前に取ってから1日たっていれば取り直す
// 6時間ごとの自動再読み込み：Silk 以外のみ。Silk では再読み込み後に全画面と無音再生の再タップが必要になるため行わない。
// 重くなったら設定の「ページを再読み込み」を使う。
if (!IS_SILK) setTimeout(() => location.reload(), 6 * 3600 * 1000);
refreshStatus();
</script>
</body>
</html>
